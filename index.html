<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Sleep Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1117;--card:#171b24;--fg:#e8ecf3;--sub:#8b93a7;--line:#242a36;
      --sleep:#5b7cfa;--pn:#f0a132;--stop:#e2504b;--ok:#3fb950;--ang:#6d8fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--fg);
     font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
     padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 12px}
h1{font-size:16px;margin:0;letter-spacing:.04em}
.sub{color:var(--sub);font-size:12px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.warn{background:#3a2f12;color:#ffd68a;border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;line-height:1.5}
button{font:inherit;color:#fff;border:0;border-radius:14px;padding:12px;background:#2a3040}
.big{width:100%;font-size:21px;font-weight:700;padding:26px 14px;margin-bottom:10px;line-height:1.3}
.sleep{background:var(--sleep)}.pn{background:var(--pn);color:#231a05}
.stop{background:var(--stop)}.ang{background:var(--ang)}.okb{background:#2f7d43}
.timer{font-size:44px;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0;font-weight:700}
.center{text-align:center}.mt{margin-top:10px}
.row{display:flex;gap:6px}.row>*{flex:1}
.small{font-size:13px;padding:9px}
.seg.on{background:#2f4fd8}
.adj{font-size:13px;padding:10px 0;background:#2a3040;touch-action:none;user-select:none}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;margin-right:6px;white-space:nowrap}
.t-sleep{background:#26305c;color:#aebcff}.t-pn{background:#4a3512;color:#ffcf8a}
.t-ang{background:#24323a;color:#bcd7e6}
.dot{width:7px;height:7px;border-radius:50%;background:var(--stop);display:inline-block;margin-left:6px}
.sync{color:var(--sub);font-size:12px;text-align:center;min-height:16px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2c3342;
      background:#0f131b;color:var(--fg);font:inherit;margin-bottom:8px}
textarea{min-height:110px;font-size:13px;line-height:1.5}
input[type=time]{width:auto;margin:0;padding:7px 9px}
details summary{color:var(--sub);font-size:13px;padding:6px 4px}
dialog{background:var(--card);color:var(--fg);border:0;border-radius:16px;
       width:92%;max-width:440px;padding:0;max-height:88vh}
dialog::backdrop{background:#000a}
.pad{padding:16px}
label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#222836;border:1px solid #2f3646;color:#c7cedd;
      border-radius:999px;padding:9px 13px;font-size:13px}
.chip.on{background:#2f4fd8;border-color:#5b7cfa;color:#fff}
.chip.on.a{background:#3d6b85;border-color:#6d8fa8}
.chip.on.auto{background:#26305c;border-style:dashed;border-color:#8aa0ff}
.mini{font-size:12px;color:var(--sub)}
.lvbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
       background:#222836;border:1px solid #2f3646;margin-bottom:6px;padding:13px}
.lvbtn.on{background:#3d6b85;border-color:#6d8fa8}
.lvic{font-size:19px;width:26px;text-align:center}
.drow{padding:10px 0;border-bottom:1px solid var(--line)}
.dlab{font-size:14px;margin-bottom:7px}
.num{margin:0}
</style>
</head>
<body>
<header><h1 id="appTitle">SLEEP LOG</h1><div class="sub" id="today"></div></header>

<div class="warn" id="warn" style="display:none">この端末は同期の設定がまだです。下の「設定」に URL とトークンを入れるか、Mac で作ったセットアップリンクを開いてください。</div>

<div class="card" id="main"></div>

<div class="card">
  <div class="row" style="align-items:center">
    <div class="sub" id="daySum" style="flex:2"></div>
    <button class="small okb" id="btnDay" style="flex:1">日次チェック</button>
  </div>
</div>

<div class="card">
  <div class="row" style="align-items:center">
    <div class="sub" id="angSum" style="flex:2"></div>
    <button class="small ang" id="btnAng" style="flex:1">記録</button>
  </div>
</div>

<div class="card">
  <div class="sub" style="margin-bottom:6px">履歴（直近7日・タップで修正）</div>
  <div id="hist"></div>
</div>

<div class="sync" id="syncmsg"></div>
<button class="small mt" id="btnSync" style="width:100%">同期（スプレッドシート）</button>

<button class="small mt okb" id="btnCfg" style="width:100%">項目をカスタマイズ</button>

<details class="mt">
  <summary>設定</summary>
  <div class="card mt">
    <label>GAS ウェブアプリ URL（/exec）</label>
    <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <label>トークン</label>
    <input id="cfgToken" autocomplete="off">
    <button class="small" id="btnGen" style="width:100%">ランダムなトークンを作る</button>
    <button class="small okb mt" id="btnSave" style="width:100%">保存して同期</button>
    <button class="small mt" id="btnLink" style="width:100%">セットアップリンクをコピー（他の端末用）</button>
    <input id="linkOut" class="mt" readonly style="display:none">
    <div class="center mini mt" id="cfgMsg"></div>
  </div>
</details>

<details class="mt">
  <summary>削除済みの記録（復元できます）</summary>
  <div class="card mt" id="trash"></div>
</details>

<!-- 睡眠 / PN -->
<dialog id="dlg"><div class="pad">
  <div id="dlgTitle" style="font-weight:700"></div>
  <div class="center mt" id="dlgDur" style="font-size:24px;font-weight:700"></div>

  <label>開始 <span id="dlgStartT" style="color:var(--fg);font-size:14px"></span></label>
  <div class="row"><button class="adj" data-f="s" data-n="-60">−60</button>
    <button class="adj" data-f="s" data-n="-10">−10</button>
    <button class="adj" data-f="s" data-n="-1">−1</button>
    <button class="adj" data-f="s" data-n="1">＋1</button>
    <button class="adj" data-f="s" data-n="10">＋10</button>
    <button class="adj" data-f="s" data-n="60">＋60</button></div>

  <label>終了 <span id="dlgEndT" style="color:var(--fg);font-size:14px"></span></label>
  <div class="row"><button class="adj" data-f="e" data-n="-60">−60</button>
    <button class="adj" data-f="e" data-n="-10">−10</button>
    <button class="adj" data-f="e" data-n="-1">−1</button>
    <button class="adj" data-f="e" data-n="1">＋1</button>
    <button class="adj" data-f="e" data-n="10">＋10</button>
    <button class="adj" data-f="e" data-n="60">＋60</button></div>

  <details class="mt"><summary>時刻を直接入力</summary>
    <div class="row mt" style="align-items:center">
      <span class="mini">開始</span><input type="time" id="inS">
      <span class="mini">終了</span><input type="time" id="inE"></div>
  </details>

  <label>メモ（もう一度タップで解除）</label>
  <div class="chips" id="dlgTags"></div>
  <input id="dlgNote" class="mt" placeholder="自由メモ（任意）">

  <div class="row mt">
    <button class="small stop" id="dlgDel">削除</button>
    <button class="small" id="dlgClose" style="flex:2">閉じる</button>
  </div>
</div></dialog>

<!-- 場面ログ -->
<dialog id="adlg"><div class="pad">
  <div style="font-weight:700"><span id="aHead"></span> <span class="mini" id="aTime"></span></div>

  <label>いつ（思い出して記録するときは直す）<span id="aTimeNote" style="color:#ffcf8a"></span></label>
  <div class="row" style="align-items:center">
    <button class="small seg" id="aDayT">今日</button>
    <button class="small seg" id="aDayY">昨日</button>
    <input type="time" id="aInT">
  </div>
  <div class="row mt"><button class="adj" data-f="a" data-n="-60">−60</button>
    <button class="adj" data-f="a" data-n="-10">−10</button>
    <button class="adj" data-f="a" data-n="-1">−1</button>
    <button class="adj" data-f="a" data-n="1">＋1</button>
    <button class="adj" data-f="a" data-n="10">＋10</button>
    <button class="adj" data-f="a" data-n="60">＋60</button></div>

  <label>自分の反応（必須・もう一度タップで解除）</label>
  <div id="aLv"></div>
  <label>相手</label><div class="chips" id="aWho"></div>
  <label>場面（複数可）</label><div class="chips" id="aTrig"></div>
  <input id="aNote" class="mt" placeholder="自由メモ（任意）">
  <div class="row"><button class="small" id="aSame">前回と同じ相手・場面を入れる</button></div>
  <div class="center mini mt" id="aMsg"></div>
  <div class="row mt">
    <button class="small stop" id="aDel">削除</button>
    <button class="small" id="aCancel">キャンセル</button>
    <button class="small okb" id="aSave" style="flex:2">保存</button>
  </div>
</div></dialog>

<!-- 日次チェック（タップで即時反映） -->
<dialog id="ddlg"><div class="pad">
  <div style="font-weight:700">日次チェック <span class="mini" id="dDate"></span></div>
  <div class="row mt">
    <button class="small seg" id="dToday">今日</button>
    <button class="small seg" id="dYest">昨日</button>
  </div>
  <div id="dList"></div>

  <label>前日の Brave（デジタルウェルビーイング）<span id="dBraveDay"></span></label>
  <div class="row" style="align-items:center">
    <input type="number" class="num" id="dBn" inputmode="numeric" placeholder="回数">
    <span class="mini" style="flex:0 0 auto">回</span>
    <input type="number" class="num" id="dBh" inputmode="numeric" placeholder="時間">
    <span class="mini" style="flex:0 0 auto">時間</span>
    <input type="number" class="num" id="dBm" inputmode="numeric" placeholder="分">
    <span class="mini" style="flex:0 0 auto">分</span>
  </div>

  <div class="center mini mt" id="dSum"></div>
  <button class="small mt" id="dClose" style="width:100%">閉じる</button>
</div></dialog>

<!-- カスタマイズ -->
<dialog id="cdlg"><div class="pad">
  <div style="font-weight:700">項目をカスタマイズ</div>
  <div class="mini mt">1行に1項目。アイコンを付けたい行は「アイコン,ラベル」。行頭に # を付けると非表示（データは残ります）。</div>

  <label>このログの名前</label>
  <input id="cTitle" placeholder="場面ログ">

  <label>自分の反応（上から順に記録されます）</label>
  <textarea id="cLevels"></textarea>

  <label>相手</label>
  <textarea id="cWho"></textarea>

  <label>場面</label>
  <textarea id="cTrig"></textarea>

  <label>睡眠メモのタグ（3つめに wake と書いた行は排他選択）</label>
  <textarea id="cTags"></textarea>

  <label>日次チェック（3つめ: x3＝回数型 / auto:wake・auto:padlet・auto:toilet＝自動判定）</label>
  <textarea id="cDaily"></textarea>

  <label>自動判定の基準</label>
  <div class="row" style="align-items:center">
    <span class="mini" style="flex:0 0 auto">起床目標</span><input type="time" id="cWake">
    <span class="mini" style="flex:0 0 auto">±</span><input type="number" class="num" id="cTol" inputmode="numeric">
    <span class="mini" style="flex:0 0 auto">分</span>
  </div>
  <div class="row mt" style="align-items:center">
    <span class="mini" style="flex:0 0 auto">排便→退出 上限</span><input type="number" class="num" id="cToilet" inputmode="numeric">
    <span class="mini" style="flex:0 0 auto">分</span>
  </div>

  <div class="center mini mt" id="cMsg"></div>
  <div class="row mt">
    <button class="small" id="cReset">初期値に戻す</button>
    <button class="small" id="cCancel">キャンセル</button>
    <button class="small okb" id="cSave" style="flex:2">保存</button>
  </div>
</div></dialog>

<script>
/* ===== 初期値（実際の項目は config シートと同期。ここは一般的な内容のみ） ===== */
const DEFAULTS={
  title:'場面ログ',
  levels:[
    {icon:'🌱',label:'落ち着いて対応できた'},
    {icon:'🙂',label:'ふつうに対応した'},
    {icon:'😶',label:'不機嫌な態度・無言'},
    {icon:'🗯️',label:'きつい言い方'},
    {icon:'📢',label:'大きな声を出した'}
  ],
  who:['家族','職場','その他'],
  trig:['朝の支度','食事','片づけ','寝かしつけ','自分が寝不足','自分が疲れている','時間に追われた'],
  tags:[
    {icon:'◎',label:'寝起き◎',group:'wake'},
    {icon:'○',label:'寝起き○',group:'wake'},
    {icon:'△',label:'寝起き△',group:'wake'},
    {icon:'☾',label:'中途覚醒'},
    {icon:'🍺',label:'飲酒'},
    {icon:'🤒',label:'体調不良'},
    {icon:'📱',label:'夜更かし'},
    {icon:'💭',label:'夢'}
  ],
  daily:[
    {icon:'⏰',label:'起床 3:30±10分',opt:'auto:wake'},
    {icon:'📌',label:'Padlet 投稿',opt:'auto:padlet'},
    {icon:'🚽',label:'排便→退出 40分以内',opt:'auto:toilet'},
    {icon:'🃏',label:'Anki 金フレ 10枚',opt:'x3'},
    {icon:'🃏',label:'Anki Distinction 10枚',opt:'x3'},
    {icon:'✍️',label:'聖書模写・黙想 A5 1枚'},
    {icon:'🙏',label:'Obsidian 朝の祈り（音声入力）'}
  ],
  rt:{wake:'03:30',tol:10,toilet:40}
};
const PN_LIMIT=3;
const DAY_CUT=3;                 // 日次・ルーティンの日付は 3:00 で切り替え
const DEFAULT_URL='...';         // 実値は入れない（各端末の設定に保存）
const DEFAULT_TOKEN='...';
/* ============================================================ */

const $=id=>document.getElementById(id);
function on(id,ev,fn){const el=$(id);
  if(el) el.addEventListener(ev,fn); else console.warn('missing element:',id);}
const isReal=v=>!!v&&v!=='...';

const KEY='sleeplog.v2';
const blank=()=>({items:[],settings:{url:'',token:''}});
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){
  db=blank();
  try{const o=JSON.parse(localStorage.getItem('sleeplog.v1'));
    if(o){db.settings=o.settings||db.settings;
      (o.records||[]).forEach(r=>db.items.push({id:r.id,kind:'sleep',type:r.type,
        start:r.start,end:r.end,dateKey:r.dateKey,tags:[],note:'',
        deleted:!!r.deleted,updatedAt:r.end||new Date().toISOString(),synced:false}));}
  }catch(e){}
}
if(!db.items) db.items=[];
if(!db.settings) db.settings={url:'',token:''};
if(!db.settings.url&&isReal(DEFAULT_URL))     db.settings.url=DEFAULT_URL;
if(!db.settings.token&&isReal(DEFAULT_TOKEN)) db.settings.token=DEFAULT_TOKEN;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt=d=>new Date(d).toLocaleString('ja-JP',
  {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const clone=o=>JSON.parse(JSON.stringify(o));
const dayKeyOf=d=>{const x=new Date(d);x.setHours(x.getHours()-DAY_CUT);return dkey(x);};
const shiftKey=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d);};
const isOffStr=s=>typeof s==='string'&&s.startsWith('#');

/* ---------- 設定（項目定義）: 1レコードとして同期 ---------- */
const CFG_KEYS=['title','levels','who','trig','tags','daily','rt'];
function cfgRec(){
  let c=db.items.find(i=>i.kind==='config');
  if(!c){c={id:'CONFIG',kind:'config',data:clone(DEFAULTS),
    updatedAt:new Date(0).toISOString(),synced:false};db.items.push(c);}
  if(!c.data) c.data=clone(DEFAULTS);
  CFG_KEYS.forEach(k=>{if(c.data[k]===undefined) c.data[k]=clone(DEFAULTS[k]);});
  ['wake','tol','toilet'].forEach(k=>{
    if(c.data.rt[k]===undefined) c.data.rt[k]=DEFAULTS.rt[k];});
  return c;
}
const C=()=>cfgRec().data;

/* 旧バージョンのタグキー・反応段階をラベルへ移行（初回のみ） */
const OLD_TAG={sex:'sex',wake2:'寝起き◎',wake1:'寝起き○',wake0:'寝起き△',
  awake:'中途覚醒',alc:'飲酒',sick:'体調不良',late:'夜更かし',dream:'夢'};
const OLD_LV=['気づいて流せた','不機嫌な態度・無言','嫌味・きつい言葉',
  '大きな声・怒鳴った','物に当たった','手が出た'];
if(!db.migrated2){
  db.items.forEach(i=>{
    if(i.kind==='sleep'&&Array.isArray(i.tags))
      i.tags=i.tags.map(t=>OLD_TAG[t]||t);
    if(i.kind==='anger'&&!i.levelKey&&typeof i.level==='number')
      i.levelKey=OLD_LV[i.level]||'';
  });
  db.migrated2=true;save();
}

const live=()=>db.items.filter(i=>!i.deleted&&i.kind!=='config');
const activeRec=()=>live().find(i=>i.kind==='sleep'&&!i.end);
function logicalDate(type,iso){const d=new Date(iso);
  if(type==='sleep')d.setHours(d.getHours()-12);return dkey(d);}
const mins=r=>r.end?Math.max(0,Math.round((new Date(r.end)-new Date(r.start))/60000)):0;
const durText=m=>m>=60?`${Math.floor(m/60)}時間${pad(m%60)}分`:`${m}分`;
const touch=r=>{r.updatedAt=now();r.synced=false;};
const drop=r=>{
  if(!r)return;
  if(r.everSynced){r.deleted=true;touch(r);}
  else{const i=db.items.indexOf(r);if(i>=0)db.items.splice(i,1);}
  save();};
const pnToday=()=>live().filter(i=>i.kind==='sleep'&&i.type==='pn'
  &&i.dateKey===dkey(new Date())).length;
const pnIndexOf=r=>live().filter(x=>x.kind==='sleep'&&x.type==='pn'
  &&x.dateKey===r.dateKey&&new Date(x.start)<=new Date(r.start)).length;
const tagDef=lb=>C().tags.find(t=>t.label===lb)||{icon:'',label:lb};
function lvDef(r){
  const L=C().levels;
  let d=L.find(x=>x.label===r.levelKey);
  if(!d&&typeof r.level==='number') d=L[r.level];
  return d||{icon:'·',label:r.levelKey||'(未設定)'};
}

/* ---------- 計測 ---------- */
function startRec(type){
  if(activeRec())return;
  const s=now();
  db.items.push({id:uid(),kind:'sleep',type,start:s,end:null,
    dateKey:logicalDate(type,s),tags:[],note:'',updatedAt:s,synced:false});
  save();render();sync(true);
}
function stopRec(){
  const a=activeRec(); if(!a)return;
  a.end=now();touch(a);save();render();openEdit(a.id);sync(true);
}

/* ---------- 描画 ---------- */
function render(){
  const m=$('main'),a=activeRec(),pn=pnToday();
  $('today').textContent=`${dkey(new Date())} ／ PN ${pn}/${PN_LIMIT}`;
  $('warn').style.display=(db.settings.url&&db.settings.token)?'none':'';
  if(a){
    m.innerHTML=`<div class="center sub">${a.type==='pn'?'パワーナップ':'睡眠'}中　開始 ${hhmm(new Date(a.start))}</div>
      <div class="timer" id="tmr">00:00:00</div>
      <button class="big stop" id="bStop">起きた（終了）</button>
      <div class="row"><button class="small" id="bCancel">開始を取り消す</button></div>`;
    on('bStop','click',stopRec);
    on('bCancel','click',()=>{if(confirm('この計測を破棄しますか？')){drop(a);render();sync(true);}});
    tick();
  }else{
    const last=live().filter(i=>i.kind==='sleep'&&i.end)
      .sort((x,y)=>new Date(x.end)-new Date(y.end)).pop();
    m.innerHTML=`<button class="big sleep" id="bS">😴 睡眠を開始</button>
      <button class="big pn" id="bP">⚡ パワーナップ開始${pn>=PN_LIMIT?'（本日上限）':`（残り${PN_LIMIT-pn}）`}</button>
      <div class="center sub">${last?`直近: ${last.type==='pn'?'PN':'睡眠'} ${durText(mins(last))}（${hhmm(new Date(last.start))}→${hhmm(new Date(last.end))}）`:'まだ記録がありません'}</div>`;
    on('bS','click',()=>startRec('sleep'));

/* ---------- 日次チェック（タップで即時反映） ---------- */
const dayId=k=>'DAY-'+k.replace(/-/g,'');
function dailyRec(k,create){
  let r=db.items.find(i=>i.kind==='daily'&&i.id===dayId(k));
  if(!r&&create){
    r={id:dayId(k),kind:'daily',dateKey:k,start:new Date(k+'T12:00:00').toISOString(),
       end:null,checks:{},ovr:{},auto:{},brave:null,updatedAt:now(),synced:false};
    db.items.push(r);
  }
  if(r&&create&&r.deleted) r.deleted=false;
  return r;
}
const dItems=()=>C().daily.filter(x=>!x.off);
function dType(it){
  const o=it.opt||'';
  if(o.startsWith('auto:')) return {t:'auto',key:o.slice(5)};
  const m=o.match(/^x(\d+)$/); if(m) return {t:'count',n:Math.max(1,+m[1])};
  return {t:'tri'};
}
function autoVal(key,k){
  const rt=C().rt;
  if(key==='wake'){
    const lo=new Date(k+'T02:00:00'),hi=new Date(k+'T07:00:00');
    const s=live().filter(i=>i.kind==='sleep'&&i.type==='sleep'&&i.end
      &&new Date(i.end)>=lo&&new Date(i.end)<=hi)
      .sort((a,b)=>new Date(a.end)-new Date(b.end)).pop();
    if(!s) return null;
    const [H,M]=(rt.wake||'03:30').split(':').map(Number);
    const t=new Date(k+'T00:00:00');t.setHours(H,M,0,0);
    const diff=Math.round((new Date(s.end)-t)/60000);
    return {v:Math.abs(diff)<=(+rt.tol||0)?'ok':'ng',
      text:`${hhmm(new Date(s.end))}（${diff>=0?'+':''}${diff}分）`};
  }
  return null;   // padlet / toilet は第2弾（朝ルーティン）で判定
}
function dailyEval(k,rec){
  if(rec===undefined) rec=dailyRec(k,false);
  if(rec&&rec.deleted) rec=null;
  const ch=(rec&&rec.checks)||{},ov=(rec&&rec.ovr)||{};
  let done=0,total=0,filled=0;
  const rows=dItems().map(it=>{
    const ty=dType(it);let v,auto=null,manual=false;
    if(ty.t==='auto'){
      auto=autoVal(ty.key,k);
      if(ov[it.label]!==undefined){v=ov[it.label];manual=true;}
      else v=auto?auto.v:undefined;
    }else v=ch[it.label];
    const ok=ty.t==='count'?v===ty.n:v==='ok';
    if(v!=='na'){total++;if(ok)done++;}
    if(v!==undefined)filled++;
    let mark=v===undefined?'未':v==='na'?'−':v==='ok'?'○':v==='ng'?'✕':`${v}/${ty.n}`;
    if(ty.t==='auto'&&v!==undefined) mark+=manual?'(手)':'(自)';
    return {it,ty,v,auto,manual,ok,mark};
  });
  return {rows,done,total,filled};
}
function snapAuto(rec){        // 自動判定の結果を記録に残す（スプレッドシート用）
  const e=dailyEval(rec.dateKey,rec),a={};
  e.rows.forEach(r=>{if(r.ty.t==='auto'&&r.auto)a[r.it.label]=r.auto;});
  const changed=JSON.stringify(rec.auto||{})!==JSON.stringify(a);
  rec.auto=a; return changed;
}

function setDaily(r,val){
  const rec=dailyRec(dk,true),L=r.it.label;
  rec.checks=rec.checks||{};rec.ovr=rec.ovr||{};
  if(r.ty.t==='auto'){
    if(r.manual&&rec.ovr[L]===val) delete rec.ovr[L];   // もう一度で自動に戻す
    else rec.ovr[L]=val;
  }else{
    if(rec.checks[L]===val) delete rec.checks[L];        // もう一度で解除
    else rec.checks[L]=val;
  }
  snapAuto(rec);touch(rec);save();drawDaily();

const toLines=(arr,key)=>arr.map(x=>{
  if(typeof x==='string') return x;
  const s=[x.icon||'',x.label||''].concat(key&&x[key]?[x[key]]:[]).join(',');
  return (x.off?'#':'')+s;
}).join('\n');
const parsePlain=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
function parseIcon(s,key){
  return s.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
    let off=false;
    if(line.startsWith('#')){off=true;line=line.slice(1).trim();}
    const p=line.split(',').map(y=>y.trim());
    const o=p.length>1?{icon:p[0],label:p[1]}:{icon:'',label:p[0]};
    if(key&&p[2]) o[key]=p[2];
    if(off) o.off=true;
    return o;
  }).filter(o=>o.label);
}
function fillCfg(c){
  $('cTitle').value=c.title;
  $('cLevels').value=toLines(c.levels);
  $('cWho').value=toLines(c.who);
  $('cTrig').value=toLines(c.trig);
  $('cTags').value=toLines(c.tags,'group');
  $('cDaily').value=toLines(c.daily,'opt');
  $('cWake').value=c.rt.wake;
  $('cTol').value=c.rt.tol;
  $('cToilet').value=c.rt.toilet;
}

on('cSave','click',()=>{
  const lv=parseIcon($('cLevels').value,null);
  if(!lv.filter(x=>!x.off).length){$('cMsg').textContent='「自分の反応」は1つ以上必要です';return;}
  const num=(id,d)=>{const v=$(id).value;return v===''||isNaN(+v)?d:+v;};
  const rec=cfgRec();
  rec.data=Object.assign({},rec.data,{           // 既存データとマージ（知らない項目を消さない）
    title:$('cTitle').value.trim()||DEFAULTS.title,
    levels:lv,
    who:parsePlain($('cWho').value),
    trig:parsePlain($('cTrig').value),
    tags:parseIcon($('cTags').value,'group'),
    daily:parseIcon($('cDaily').value,'opt'),
    rt:Object.assign({},rec.data.rt,{
      wake:$('cWake').value||DEFAULTS.rt.wake,
      tol:num('cTol',DEFAULTS.rt.tol),
      toilet:num('cToilet',DEFAULTS.rt.toilet)})
  });
  touch(rec);save();$('cdlg').close();render();sync(true);
});

/* ---------- 同期 ---------- */
function forPush(i){
  const o=Object.assign({},i); delete o.synced; delete o.everSynced;
  if(i.kind==='sleep'){
    o.minutes=mins(i);
    o.pnIndex=i.type==='pn'?pnIndexOf(i):'';
    o.tagText=(i.tags||[]).map(k=>{const t=tagDef(k);return (t.icon||'')+t.label;}).join(' ');
  }else if(i.kind==='anger'){
    const l=lvDef(i);
    o.levelText=(l.icon||'')+' '+l.label;
  }else if(i.kind==='daily'){
    const e=dailyEval(i.dateKey,i);
    o.doneCount=e.done;o.total=e.total;
    o.checkText=e.rows.map(r=>r.it.label+'='+r.mark).join('|');
  }
  return o;
}
function merge(remote){
  const map={}; db.items.forEach(i=>map[i.id]=i);
  (remote||[]).forEach(r=>{
    const l=map[r.id];
    if(!l){db.items.push(Object.assign(r,{synced:true,everSynced:true}));map[r.id]=r;}
    else if((r.updatedAt||'')>(l.updatedAt||'')) Object.assign(l,r,{synced:true,everSynced:true});
  });
}
let busy=false;
async function sync(silent){
  const url=db.settings.url,token=db.settings.token;
  if(!url||!token){if(!silent)msg('設定に URL とトークンを入れてください');return;}
  if(busy)return; busy=true;
  if(!silent)msg('同期中…');
  try{
    const push=db.items.filter(i=>!i.synced).map(forPush);
    const res=await fetch(url,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:token,push:push})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'NG');
    (j.saved||[]).forEach(id=>{const r=db.items.find(x=>x.id===id);
      if(r){r.synced=true;r.everSynced=true;}});
    merge(j.items);save();render();
    msg('同期しました '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){msg('同期失敗：'+e.message+'（記録は端末に保持）');}
  finally{busy=false;}
}
function msg(t){$('syncmsg').textContent=t;$('cfgMsg').textContent=t;}
on('btnSync','click',()=>sync(false));
on('btnSave','click',()=>{
  db.settings.url=$('cfgUrl').value.trim();
  db.settings.token=$('cfgToken').value.trim();
  save();render();msg('保存しました');sync(false);});
on('btnGen','click',()=>{
  const a=new Uint8Array(18);crypto.getRandomValues(a);
  $('cfgToken').value=btoa(String.fromCharCode(...a))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  msg('新しいトークンを作りました。GAS に同じ値を入れてから「保存して同期」を押してください');
});
on('btnLink','click',async()=>{
  const u=$('cfgUrl').value.trim(),t=$('cfgToken').value.trim();
  if(!u||!t){msg('URL とトークンを入れてください');return;}
  const link=location.origin+location.pathname+'#setup='+encodeURIComponent(JSON.stringify({u,t}));
  const o=$('linkOut');o.value=link;o.style.display='';
  try{await navigator.clipboard.writeText(link);
    msg('セットアップリンクをコピーしました（他人に送らないでください）');}
  catch(e){o.select();msg('下の欄を長押ししてコピーしてください');}
});

/* ---------- 起動 ---------- */
let setupNote='';
if(location.hash.startsWith('#setup=')){
  try{const o=JSON.parse(decodeURIComponent(location.hash.slice(7)));
    if(o&&o.u&&o.t){db.settings.url=o.u;db.settings.token=o.t;save();
      setupNote='セットアップしました。この端末に URL とトークンを保存しました';}
  }catch(e){setupNote='セットアップリンクを読み取れませんでした';}
}
$('cfgUrl').value=db.settings.url;
$('cfgToken').value=db.settings.token;

cfgRec();save();
const q=new URLSearchParams(location.search).get('a');
history.replaceState(null,'',location.pathname);   // ?a= と #setup= を URL から消す
if((q==='sleep'||q==='pn')&&!activeRec()) startRec(q);
render();
if(q==='anger') openAnger(null);
if(q==='daily') openDaily(0);
if(setupNote) msg(setupNote);
sync(true);
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
window.addEventListener('online',()=>sync(true));
</script>
